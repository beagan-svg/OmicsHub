# Lint, migration and test checks for every push and pull request.
#
# The suite needs a real Postgres — apps/queueing claims work with SELECT ... FOR UPDATE
# SKIP LOCKED, which SQLite does not implement, and one test opens a second connection
# under django_db(transaction=True) to prove two workers cannot claim the same entry. So
# this runs against a Postgres service container rather than trying to fake it.
name: CI

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer worthless. Cancel it rather
# than pay for both and read the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: omicshub.settings.test
  # config/settings/test.py fills these in with os.environ.setdefault, so the suite runs
  # without them — they are set here anyway so the workflow says out loud what it depends
  # on, and so a change to those defaults shows up as a CI failure to look at rather than
  # as a silent switch to a different database.
  #
  # Fake values, and only fake values. SECRET_KEY has no default in base.py and has to come
  # from somewhere; nothing signed by this one ever leaves the runner.
  SECRET_KEY: ci-only-not-a-real-secret
  DATABASE_URL: postgres://omicshub:omicshub@127.0.0.1:5432/omicshub
  # memory://, not the Redis service. The tests that touch the broker patch it, and pointing
  # this at a real Redis would make the health-check tests reach for workers that do not
  # exist on a runner and answer differently than they do on a developer's machine.
  CELERY_BROKER_URL: memory://
  OCS_ENV_BASE: test
  OCS_AWS_REGION: us-west-2

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 16, matching compose.yaml's postgres image, so CI cannot pass on a version the
      # deployment does not run.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omicshub
          POSTGRES_PASSWORD: omicshub
          POSTGRES_DB: omicshub
        ports:
          - 5432:5432
        # Without this the steps start before Postgres finishes first-run initialisation and
        # every test errors on connection refused.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 7, matching compose.yaml. The suite does not currently need it: config/settings/
      # test.py forces a locmem cache and the memory:// broker above, precisely so the tests
      # run on a laptop with nothing installed. It is here so that the day a test does need
      # Redis — a cache backend test, or the capacity hold exercised across processes — it
      # works without anyone having to come back and edit this file first.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv rather than pip: it is what generated the lock files and what the project's own
      # virtualenv is built with, so CI resolves dependencies the same way a developer does.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --system installs into the runner's Python rather than a venv, which is what the
        # later steps run with. requirements-dev.lock is the runtime lock plus pytest,
        # pytest-django and ruff, all pinned — a new ruff release should fail the build on
        # the commit that upgrades it, not on an unrelated pull request.
        run: uv pip install --system -r requirements-dev.lock

      - name: Check the lock files still match pyproject.toml
        # The locks are generated, and a dependency added to pyproject.toml without
        # regenerating them is a dependency the Docker image will not have. Recompiling and
        # diffing is the check; uv pip compile has no --check of its own.
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.12 \
            --no-header -o /tmp/requirements.lock
          uv pip compile pyproject.toml --group dev --universal --python-version 3.12 \
            --no-header -o /tmp/requirements-dev.lock
          # Comment lines are dropped from both sides: it is the pinned versions that have
          # to match, not the hand-written header the committed file carries and the freshly
          # compiled one does not.
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock) \
            || { echo "::error::requirements.lock is stale — regenerate it (see the file header)"; exit 1; }
          diff <(grep -v '^#' requirements-dev.lock) <(grep -v '^#' /tmp/requirements-dev.lock) \
            || { echo "::error::requirements-dev.lock is stale — regenerate it (see the file header)"; exit 1; }

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check for model changes with no migration
        # The failure this catches: a field added to a model and shipped without the
        # migration, which passes every test on a developer's already-migrated database and
        # then breaks the deployment's `migrate` step. --check exits non-zero if
        # makemigrations would have written anything; --dry-run keeps it from writing.
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python -m pytest -q
