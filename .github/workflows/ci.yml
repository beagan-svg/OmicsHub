# Lint, migration and test checks for every push and pull request.
#
# The suite needs PostgreSQL because queue claims use SELECT ... FOR UPDATE
# SKIP LOCKED, which SQLite does not implement, and one test opens a second connection
# under django_db(transaction=True) to prove two workers cannot claim the same entry. So
# this runs against a Postgres service container rather than trying to fake it.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: omicshub.settings.test
  SECRET_KEY: ci-only-not-a-real-secret-with-enough-length-for-django-checks-12345
  DATABASE_URL: postgres://omicshub:omicshub@127.0.0.1:5432/omicshub
  CELERY_BROKER_URL: memory://
  OCS_ENV_BASE: test
  OCS_AWS_REGION: us-west-2

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omicshub
          POSTGRES_PASSWORD: omicshub
          POSTGRES_DB: omicshub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Check the lock file matches pyproject.toml
        run: uv lock --check

      - name: Check the production requirements export
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt \
            --output-file /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check for model changes with no migration
        # The failure this catches: a field added to a model and shipped without the
        # migration, which passes every test on a developer's already-migrated database and
        # then breaks the deployment's `migrate` step. --check exits non-zero if
        # makemigrations would have written anything; --dry-run keeps it from writing.
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Check production settings
        env:
          DJANGO_SETTINGS_MODULE: omicshub.settings.prod
          CREDENTIAL_ENCRYPTION_KEY: 2fPuizO90Xj1avGhT1E3AAVDfKZT1T1cgccHh5p_6a8=
          CACHE_URL: redis://localhost:6379/0
          ALLOWED_HOSTS: localhost
          CSRF_TRUSTED_ORIGINS: https://localhost
          SECURE_SSL_REDIRECT: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
        # Use production settings with CI-only values. The deploy check validates settings
        # and does not need a live database, AWS account, or Celery worker.
        run: uv run python manage.py check --deploy

      - name: Type check
        run: uv run mypy apps omicshub docker_tools

      - name: Test Django suite
        run: uv run python -m pytest -q --ignore=apps/web_ui/tests/playwright

      - name: Test browser flows
        env:
          # pytest-playwright's synchronous browser fixture runs an event loop while the
          # live-server fixtures create test records. This setting is limited to these
          # browser tests and is not used by application code or the Django suite.
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
        run: uv run python -m pytest -q apps/web_ui/tests/playwright
