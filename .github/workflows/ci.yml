# Lint, migration and test checks for every push and pull request.
#
# The suite needs a real Postgres — apps/queueing claims work with SELECT ... FOR UPDATE
# SKIP LOCKED, which SQLite does not implement, and one test opens a second connection
# under django_db(transaction=True) to prove two workers cannot claim the same entry. So
# this runs against a Postgres service container rather than trying to fake it.
name: CI

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer worthless. Cancel it rather
# than pay for both and read the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: omicshub.settings.test
      # omicshub/settings/test.py fills these in with os.environ.setdefault, so the suite runs
  # without them — they are set here anyway so the workflow says out loud what it depends
  # on, and so a change to those defaults shows up as a CI failure to look at rather than
  # as a silent switch to a different database.
  #
  # Fake values, and only fake values. SECRET_KEY has no default in base.py and has to come
  # from somewhere; nothing signed by this one ever leaves the runner.
  SECRET_KEY: ci-only-not-a-real-secret-with-enough-length-for-django-checks-12345
  DATABASE_URL: postgres://omicshub:omicshub@127.0.0.1:5432/omicshub
  # memory://, not the Redis service. The tests that touch the broker patch it, and pointing
  # this at a real Redis would make the health-check tests reach for workers that do not
  # exist on a runner and answer differently than they do on a developer's machine.
  CELERY_BROKER_URL: memory://
  CACHE_URL: redis://127.0.0.1:6379/0
  OCS_ENV_BASE: test
  OCS_AWS_REGION: us-west-2

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 16, matching compose.yaml's postgres image, so CI cannot pass on a version the
      # deployment does not run.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omicshub
          POSTGRES_PASSWORD: omicshub
          POSTGRES_DB: omicshub
        ports:
          - 5432:5432
        # Without this the steps start before Postgres finishes first-run initialisation and
        # every test errors on connection refused.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 7, matching compose.yaml. The suite does not currently need it: omicshub/settings/
      # test.py forces a locmem cache and the memory:// broker above, precisely so the tests
      # run on a laptop with nothing installed. It is here so that the day a test does need
      # Redis — a cache backend test, or the capacity hold exercised across processes — it
      # works without anyone having to come back and edit this file first.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv is the project's dependency manager, so CI uses the same lockfile as local development.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check the lock file matches pyproject.toml
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check for model changes with no migration
        # The failure this catches: a field added to a model and shipped without the
        # migration, which passes every test on a developer's already-migrated database and
        # then breaks the deployment's `migrate` step. --check exits non-zero if
        # makemigrations would have written anything; --dry-run keeps it from writing.
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Check production settings
        env:
          DJANGO_SETTINGS_MODULE: omicshub.settings.prod
          ALLOWED_HOSTS: localhost
          CSRF_TRUSTED_ORIGINS: https://localhost
          SECURE_SSL_REDIRECT: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
        # Use production settings with CI-only values. The deploy check validates settings
        # and does not need a live database, AWS account, or Celery worker.
        run: uv run python manage.py check --deploy

      - name: Type check stable application boundaries
        # The first typing gate covers models, the OCS command boundary, and the container
        # health probe. The remaining dynamic manifest and view code is being typed in stages.
        run: uv run mypy apps/sample_catalog/models.py apps/workflow_engine/models.py apps/submission_queue/models.py apps/ocs_integration/cli.py docker_tools/healthcheck.py

      - name: Test
        run: uv run python -m pytest -q
