{% extends "viewer/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Toggle Functionality Debug</h5>
        </div>
        <div class="card-body">
            <h6>Toggle Controls</h6>
            <div class="row">
                {% for field in metadata_fields %}
                <div class="col-md-4 mb-3">
                    <div class="form-check form-switch">
                        <input type="checkbox" 
                               id="toggle_{{ field }}" 
                               class="form-check-input metadata-toggle" 
                               data-field="{{ field }}"
                               checked>
                        <label class="form-check-label" for="toggle_{{ field }}">{{ field }}</label>
                    </div>
                </div>
                {% endfor %}
            </div>
            
            <hr>
            
            <h6>Column Classes</h6>
            <div class="row">
                {% for field in metadata_fields %}
                <div class="col-md-4 mb-2">
                    <div class="column-{{ field }} p-2 border">
                        column-{{ field }}
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<script src="{% static 'viewer/js/toggle-refresh.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Set up event listeners for toggles
    document.querySelectorAll('.metadata-toggle').forEach(toggle => {
        toggle.addEventListener('change', function() {
            const field = this.dataset.field;
            const enabled = this.checked;
            
            // Update column visibility immediately
            toggleColumnVisibility(field, enabled);
        });
    });
});
</script>
{% endblock %}
