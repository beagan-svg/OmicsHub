<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Database OCS{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Django Tables2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/django-tables2@2.4.1/dist/bootstrap5/css/django-tables2.min.css"
        rel="stylesheet">
    <!-- Custom CSS -->
    {% load static %}
    <link href="{% static 'viewer/css/style.css' %}" rel="stylesheet">
    <!-- Additional head content -->
    {% block extrahead %}{% endblock %}
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'viewer:main_list' %}">
                <i class="bi bi-database me-2"></i>
                Database OCS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}"
                            href="{% url 'viewer:main_list' %}">
                            <i class="bi bi-table me-1"></i> Samples
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/pipeline/' in request.path %}active{% endif %}"
                            href="{% url 'viewer:pipeline_dashboard' %}">
                            <i class="bi bi-diagram-3 me-1"></i> Pipeline
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Django Tables2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/django-tables2@2.4.1/dist/django-tables2.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Select2 -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!-- Additional scripts -->
    {% block extrascripts %}{% endblock %}

    <!-- Navigation Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Get current path
            const path = window.location.pathname;

            // Get navigation links
            const navLinks = document.querySelectorAll('.navbar-nav .nav-link');

            // Reset all links (in case template logic doesn't capture all cases)
            navLinks.forEach(link => {
                link.classList.remove('active');
            });

            // Set active class based on current path
            if (path === '/') {
                document.querySelector('a[href="{% url "viewer:main_list" %}"]').classList.add('active');
            } else if (path.includes('/pipeline/')) {
                document.querySelector('a[href="{% url "viewer:pipeline_dashboard" %}"]').classList.add('active');
            }

            // Add click handler for better user feedback
            navLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    // Add ripple effect for better user feedback
                    const ripple = document.createElement('span');
                    ripple.classList.add('nav-ripple');

                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';

                    this.appendChild(ripple);

                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });
        });
    </script>
</body>

</html>
