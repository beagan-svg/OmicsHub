{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OCS Database Viewer{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Django Tables2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/django-tables2@2.4.1/dist/bootstrap5/css/django-tables2.min.css"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'viewer/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'viewer/css/custom-table.css' %}">
    <!-- Additional head content -->
    {% block extrahead %}{% endblock %}
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    {% block extra_css %}
    {% endblock %}
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-light" style="box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <div class="container">
            <a class="navbar-brand" href="{% url 'viewer:main_list' %}" style="font-weight: 500; color: #4285F4;">
                <i class="bi bi-database-fill me-2"></i>OCS Database
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active fw-bold{% endif %}"
                            style="padding: 8px 16px;" href="{% url 'viewer:main_list' %}">
                            <i class="bi bi-table me-1"></i>Samples
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/pipeline/' in request.path %}active fw-bold{% endif %}"
                            style="padding: 8px 16px;" href="{% url 'viewer:pipeline_dashboard' %}">
                            <i class="bi bi-diagram-3 me-1"></i>Pipeline
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Django Tables2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/django-tables2@2.4.1/dist/django-tables2.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Select2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!-- Additional scripts -->
    {% block extrascripts %}{% endblock %}

    <!-- Extra scripts (used by pipeline page) -->
    {% block extra_scripts %}{% endblock %}

    <!-- Custom JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Get current path
            const path = window.location.pathname;

            // Set active navbar item
            document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
                if (link.getAttribute('href') === path) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>

</html>
