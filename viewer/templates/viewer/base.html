<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Database OCS{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Django Tables2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/django-tables2@2.4.1/dist/bootstrap5/css/django-tables2.min.css"
        rel="stylesheet">
    <!-- Custom CSS -->
    {% load static %}
    <link href="{% static 'viewer/css/style.css' %}" rel="stylesheet">
    <!-- Additional head content -->
    {% block extrahead %}{% endblock %}
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'viewer:main_list' %}">
                <i class="bi bi-database me-2"></i>
                Database OCS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' or not '/pipeline/' in request.path %}active{% endif %}"
                            href="{% url 'viewer:main_list' %}">
                            <i class="bi bi-table"></i>
                            <span>Samples</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/pipeline/' in request.path %}active{% endif %}"
                            href="{% url 'viewer:pipeline_dashboard' %}">
                            <i class="bi bi-diagram-3"></i>
                            <span>Pipeline</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Django Tables2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/django-tables2@2.4.1/dist/django-tables2.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Select2 -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!-- Additional scripts -->
    {% block extrascripts %}{% endblock %}

    <!-- Navigation Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Get current path
            const path = window.location.pathname;

            // Get navigation links
            const navLinks = document.querySelectorAll('.navbar-nav .nav-link');

            // Clean approach: first remove active class from all links
            navLinks.forEach(link => {
                link.classList.remove('active');
            });

            // Then apply active class based on current path
            if (path.includes('/pipeline/')) {
                // Pipeline page - Find link to pipeline dashboard
                const pipelineLink = document.querySelector('a[href="{% url "viewer:pipeline_dashboard" %}"]');
                if (pipelineLink) pipelineLink.classList.add('active');
            } else {
                // Default to Samples page for any non-pipeline path
                const samplesLink = document.querySelector('a[href="{% url "viewer:main_list" %}"]');
                if (samplesLink) samplesLink.classList.add('active');
            }

            // Add hover animation for icons
            navLinks.forEach(link => {
                const icon = link.querySelector('i');

                // Only set up hover animation for non-active links
                if (!link.classList.contains('active') && icon) {
                    link.addEventListener('mouseenter', function () {
                        icon.style.transform = 'translateY(-2px)';
                    });

                    link.addEventListener('mouseleave', function () {
                        icon.style.transform = '';
                    });
                }
            });
        });
    </script>
</body>

</html>
