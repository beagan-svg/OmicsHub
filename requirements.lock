#
# pyproject.toml is the source of truth for *which* packages this project depends on; it
# pins ranges, so two builds of the same commit can install two different Djangos. This
# file is the answer to *which versions*, resolved once and committed, so an image built
# today and one built in six months are the same image.
#
# Regenerate whenever a dependency is added, removed, or deliberately upgraded:
#
#     uv pip compile pyproject.toml --universal --python-version 3.12 --no-header \
#         -o requirements.lock
#     uv pip compile pyproject.toml --group dev --universal --python-version 3.12 \
#         --no-header -o requirements-dev.lock
#
# --universal so the resolution carries environment markers and stays valid for the Linux
# image as well as the macOS venv it was generated from. CI re-runs both commands and fails
# if the output differs from what is committed, so this cannot quietly go stale.
