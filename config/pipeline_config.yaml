## RNA-Seq Pipeline Configuration

# References for different organisms
references:
  armadillo: "african-green-monkey_ncbi_vero-who-p1-0_genomefixed_star2.7.1a"
  african_green_monkey: "armadillo_ncbi_mdasnov1-hap2_genome_star2-7-1a"
  arctic_ground_squirrel: "arctic-ground-squirrel_ncbi_asm342692v1_genome_star2.7.1a"
  baboon: "baboon_ncbi_panubis1-0_genome_star2.7.1a"
  capuchin: "capuchin_ncbi_gsc-monkey-1-0_genome_star2.7.1a"
  cat: "cat_ncbi_f.catus-fca126-mat1.0-gcf-018350175.1-105_genome_star2.7.1a"
  chimp: "chimp_ncbi_mpantro3-v11_genome.fixed_star2.7.1a"
  coyote: "dog_ncbi_uu-cfam-gsd-1-0_genome_star2.7.1a"
  ferret: "ferret_ncbi_asm1176430v1.1_genome_star2.7.1a"
  gray_mouse_lemur: "gray-mouse-lemur_ncbi_mmur-3-0_genome_star2.7.1a"
  human: "human_10x_grch38_genome_star2.7.1a"
  macaque: "macaque_ncbi_mmul10_genome_star2.7.1a"
  mouse: "mouse_10x_mm10_genome_star2.7.1a"
  naked_mole_rat: "naked-mole-rat_ncbi_hetgla-female-1-0_genome_star2.7.1a"

# Chemistries
chemistries:
  10xV3.1D: "SC3Pv3"
  10xRseq_Mult_noATAC: "ARC-v1"
  10xV3.1_HT: "SC3Pv3HT"
  10xV4: "SC3Pv4"

# Pipeline settings
settings:
  # Alignment process settings
  alignment:
    check_interval_minutes: 30
    max_retries: 3
    timeout_hours: 24
    
  # Notification settings
  notifications:
    email:
      enabled: true
      recipients:
        - beagan.nguy@alleninstitute.org
      events:
        - FAILED
        - COMPLETED

# Workflow mappings
workflows:
  mtx:
    asset_name: "cellranger-arc"
    command_template: "ocs fastqs align tenx-arc --reference-names \"{reference}\" --asset-name cellranger-arc --load-names \"{load_name}\" --notify-on FAILED --notify {notification_email}"
  rtx:
    asset_name: "cellranger-rnaseq"
    command_template: "ocs fastqs align tenx-rnaseq --reference-names \"{reference}\" --asset-name cellranger-rnaseq --load-names \"{load_name}\" --cellranger-addopts \"--chemistry {chemistry} --include-introns\"" 