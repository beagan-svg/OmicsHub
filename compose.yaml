# Define the complete OmicsHub stack.
#
#     docker_tools/setup_docker.sh   # create config, prepare dependencies, and start the stack
#
# `--env-file .env.docker` is required. Compose resolves `${...}` below from the shell or
# its default environment file. Without the flag the credential mount path is empty.
name: omicshub

x-app: &app
  build:
    context: .
  image: omicshub:local
  env_file: .env.docker
  environment:
    DATABASE_URL: postgres://omicshub:${POSTGRES_PASSWORD}@postgres:5432/omicshub
    CELERY_BROKER_URL: redis://redis-broker:6379/0
    CACHE_URL: redis://redis-cache:6379/0
    AWS_CREDENTIALS_FILE: /run/aws/credentials
    AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
    AWS_REGION: ${OCS_AWS_REGION}
    AWS_DEFAULT_REGION: ${OCS_AWS_REGION}
    OCS_CLI_PATH: /opt/venv/bin/ocs
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-omicshub.settings.prod}
    ENVIRONMENT: ${ENVIRONMENT:-production}
  depends_on:
    postgres:
      condition: service_healthy
    redis-broker:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
  restart: unless-stopped

x-aws-app: &aws-app
  <<: *app
  volumes:
    - ${AWS_CREDENTIALS_FILE}:/run/aws/credentials:ro

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: omicshub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: omicshub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omicshub -d omicshub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-broker:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_BROKER_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    restart: "no"

  web-ui:
    <<: *aws-app
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "python manage.py collectstatic --noinput
      && exec gunicorn omicshub.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      --access-logfile - --error-logfile -
      --max-requests 512 --max-requests-jitter 64"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
      # Local developer's LAN IP, for testing the app on a phone over the local network via
      # a devtunnel. Postgres and Redis stay bound to 127.0.0.1 only.
      - "10.0.0.7:${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "/app/docker_tools/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ocs-submission-worker:
    <<: *aws-app
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The global OCS job limit and configured submission spacing depend on a single submission
    # process. A second replica or higher concurrency could submit the same demand twice.
    # Do not `docker compose up --scale ocs-submission-worker=N`.
    command: celery -A omicshub worker --queues ocs-submissions --concurrency 1 --loglevel info
    stop_grace_period: 330s

  catalog-sync-worker:
    <<: *aws-app
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Catalog synchronization tasks read fastq metadata, fastq history, and demand registry
    # data to keep the dashboard current. This worker is separate from submissions so a long
    # metadata sweep cannot sit in front of a queued job.
    command: celery -A omicshub worker --queues catalog-sync --concurrency 2 --loglevel info

  celery-scheduler:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The schedule file is regenerated from CELERY_BEAT_SCHEDULE on start, so it is state
    # nobody needs kept. Use /tmp rather than a volume and keep it out of the read-only app tree.
    command: celery -A omicshub beat --loglevel info --schedule /tmp/celerybeat-schedule

volumes:
  pgdata:
