[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omicshub"
version = "0.1.0"
description = "Backend for queueing and submitting OCS alignment and post-alignment jobs"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "celery[redis]>=5.4",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    "sentry-sdk[django]>=2.19",
]

[tool.setuptools]
# This is a Django project, not an importable library — `apps/` and `config/` are found
# through the working directory, never installed. Pinning discovery to nothing is what
# lets the Dockerfile run `pip install .` to resolve the dependencies above without
# setuptools trying to package the app tree, and without the list being repeated there.
py-modules = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "omicshub.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Migrations are generated; Django writes long help_text lines into them. vendor/ is a copy
# of someone else's source, brought in for the Docker build — linting it reports 253 findings
# nobody here can act on, and drowns out ours.
extend-exclude = ["*/migrations/*", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
