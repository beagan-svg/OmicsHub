[project]
name = "omicshub"
version = "0.1.0"
description = "Django app for browsing OCS fastq samples and submitting workflow commands"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "boto3~=1.35.12",
    "celery[redis]>=5.4",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    "sentry-sdk[django]>=2.19",
    "cryptography>=43.0",
    # Runtime dependencies for the pinned OCS CLI source installed by Dockerfile.
    "aibs-informatics-aws-utils>=1.0.1,<2.0.0",
    "aibs-informatics-core>=1.0.5,<2.0.0",
    "pydantic~=2.11.2",
    "pytz",
    "pyyaml~=6.0",
    "requests",
    "typing-inspect",
    "python-on-whales~=0.72.0",
    "dateparser",
    "rich",
    "tabulate",
    "typer>=0.16.0,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs>=5.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-playwright>=0.5",
    "playwright>=1.47",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "omicshub.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Migrations are generated; Django writes long help_text lines into them. vendor/ is a copy
# of someone else's source, brought in for the Docker build — linting it reports 253 findings
# nobody here can act on, and drowns out ours.
extend-exclude = ["*/migrations/*", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^|/)(vendor|migrations|tests)/"

[tool.django-stubs]
django_settings_module = "omicshub.settings.test"
