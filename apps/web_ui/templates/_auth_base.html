{% load static web_ui_extras %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}OmicsHub{% endblock %}</title>

  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) { /* private mode */ }
      var root = document.documentElement;
      if (stored === "light" || stored === "dark") { root.setAttribute("data-theme", stored); }
      var dark = stored ? stored === "dark"
                        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      root.setAttribute("data-bs-theme", dark ? "dark" : "light");
    })();
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static_v 'web_ui/css/app.css' %}">
  <style>
    body { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth { width: 100%; max-width: 26rem; }

    .auth__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: var(--text-xl);
      font-weight: 600;
      letter-spacing: -0.014em;
      margin-bottom: 20px;
    }

    .auth__brand svg { width: 18px; height: 18px; }

    .auth .card-body { padding: 28px; }

    .auth .form-label { font-size: var(--text-base); margin-bottom: 6px; }

    .auth .form-control {
      font-size: var(--text-md);
      padding: 10px 12px;
      min-height: 2.75rem;
    }

    .auth .btn {
      font-size: var(--text-md);
      padding: 10px 16px;
      min-height: 2.75rem;
    }

    .auth .form-text,
    .auth .alert,
    .auth .text-secondary { font-size: var(--text-base); }

    .auth .mb-3 { margin-bottom: 1.25rem !important; }
  </style>
</head>

<body>
  <main class="auth">
    <div class="auth__brand">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
        <rect x="0" y="1" width="14" height="3" rx="1.5" fill="currentColor" opacity="0.45"/>
        <rect x="0" y="5.5" width="14" height="3" rx="1.5" fill="var(--accent)"/>
        <rect x="0" y="10" width="9" height="3" rx="1.5" fill="currentColor" opacity="0.45"/>
      </svg>
      OmicsHub
    </div>

    <div class="card">
      <div class="card-body p-4">
        {% block heading %}{% endblock %}
        {% block subheading %}{% endblock %}

        {% block form %}{% endblock %}

        <p class="text-secondary text-center mb-0 mt-3">
          {% block footer %}{% endblock %}
        </p>
      </div>
    </div>
  </main>
</body>

</html>
