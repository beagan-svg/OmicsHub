<div class="monitor-stage-filter" role="group" aria-label="{{ aria_label }}">
  <div class="btn-group btn-group-sm btn-group--scrollable" role="group">
    {% for option in stage_options %}
    <a class="btn {% if option.value == selected_stage %}active{% endif %}"
       href="{{ option.url }}" {% if option.value == selected_stage %}aria-current="page"{% endif %}>
      {{ option.label }}
    </a>
    {% endfor %}
  </div>
</div>
