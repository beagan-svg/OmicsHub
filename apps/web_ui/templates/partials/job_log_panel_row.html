<tr class="job-log-row">
  <td colspan="{{ colspan }}" class="job-log-row__cell">
    <div class="disclosure job-log-panel" id="log-panel-{{ demand_id }}" data-open="false"
         data-job-log-panel data-demand-id="{{ demand_id }}">
      <div class="disclosure__inner">
        <div class="job-log-panel__body" data-job-log-body>
          <p class="text-secondary mb-0">Provide AWS credentials above to view this job's container logs.</p>
        </div>
      </div>
    </div>
  </td>
</tr>
