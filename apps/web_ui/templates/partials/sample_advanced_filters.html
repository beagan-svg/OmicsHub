<div class="disclosure mt-3" id="{{ disclosure_id }}" data-open="{% if filters_open %}true{% else %}false{% endif %}">
  <div class="disclosure__inner">
    <div class="pt-1">
      <div class="filter-group">
        <div class="row g-2">
          <div class="col-md-4">
            <label class="label d-block mb-1" for="{{ id_prefix }}filter-batch">Batch Name From Vendor</label>
            <select name="batch_name_from_vendor" id="{{ id_prefix }}filter-batch" class="form-select form-select-sm" form="{{ filter_form_id }}">
              <option value="">All batches</option>
              {% for value in batches %}
              <option value="{{ value }}" {% if value == filters.batch_name_from_vendor %}selected{% endif %}>{{ value }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="label d-block mb-1" for="{{ id_prefix }}filter-organism">Organism Common Name</label>
            <select name="organism_common_name" id="{{ id_prefix }}filter-organism" class="form-select form-select-sm" form="{{ filter_form_id }}">
              <option value="">All organisms</option>
              {% for value in organisms %}
              <option value="{{ value }}" {% if value == filters.organism_common_name %}selected{% endif %}>{{ value }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="label d-block mb-1" for="{{ id_prefix }}filter-library-prep">Library Prep Method</label>
            <select name="library_prep_method_name" id="{{ id_prefix }}filter-library-prep" class="form-select form-select-sm" form="{{ filter_form_id }}">
              <option value="">All library preps</option>
              {% for value in library_preps %}
              <option value="{{ value }}" {% if value == filters.library_prep_method_name %}selected{% endif %}>{{ value }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <div class="row g-2">
          {% for row in stage_filters %}
          <div class="col-md-3">
            <label class="label d-block mb-1" for="{{ id_prefix }}filter-{{ row.stage.value }}-status">{{ row.stage.label }}</label>
            <select name="{{ row.stage.value }}_status" id="{{ id_prefix }}filter-{{ row.stage.value }}-status" class="form-select form-select-sm" form="{{ filter_form_id }}">
              <option value="">Any status</option>
              {% for value in statuses %}
              <option value="{{ value }}" {% if value == row.selected %}selected{% endif %}>{{ value }}</option>
              {% endfor %}
            </select>
          </div>
          {% endfor %}
        </div>
      </div>

      {% if active_filter_count %}
      <div class="d-flex align-items-center gap-2 mt-3">
        <a class="btn btn-sm btn-outline-secondary" href="{{ reset_url }}">Reset filters</a>
      </div>
      {% endif %}
    </div>
  </div>
</div>
